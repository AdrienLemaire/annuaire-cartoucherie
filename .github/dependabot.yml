version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: develop           # updates ride the same staging → production path
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3      # PR spam is how Dependabot gets switched off
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      prod-dependencies:
        dependency-type: production
        update-types: [minor, patch]
    ignore:
      # @astrojs/check peers on typescript ^5 || ^6; lift once it accepts 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
