name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Fail closed: least privilege, cancel superseded runs, cap every job.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: types, unit, build, budgets
    runs-on: ubuntu-latest        # never macos: it bills at 10x
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: node scripts/sync-content.mjs
      - run: npx astro check
      - run: node scripts/forbidden.mjs
      - run: npm test
      - run: npm run build
      - run: node scripts/forbidden-dist.mjs
      - run: node scripts/budgets.mjs
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  commits:
    name: conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx commitlint --from "origin/${{ github.base_ref }}" --to HEAD --verbose
      - name: no AI attribution
        run: |
          if git log "origin/${{ github.base_ref }}..HEAD" --format='%B' \
             | grep -niE 'co-authored-by:|generated with|claude-session'; then
            echo "::error::Commit messages credit no AI (CLAUDE.md)."
            exit 1
          fi

  browser:
    name: axe, journey, zoom, targets
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      # Chromium only. WebKit costs a minute to install and only approximates
      # Safari; real Safari is a human check on a real device.
      - name: cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 3

  lighthouse:
    name: lighthouse budgets
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - run: npx lhci autorun
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 3

  deploy:
    name: deploy to Cloudflare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, browser, lighthouse]   # the gate: no green, no deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - uses: actions/checkout@v4
      # The real quartier. Private, read-only, and never uploaded as an artifact:
      # a public repository's Actions tab hands out artifacts to anyone.
      - uses: actions/checkout@v4
        with:
          repository: lacartoucherie/cartoucherie-donnees
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          path: content-private
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          CONTENT_DIR: content-private
          # Without this the beacon ships with an empty token: the script still
          # loads, the production test still passes, and nothing is ever counted.
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
      - run: node scripts/budgets.mjs
      # The only moment a browser sees the real quartier. It runs in-process on
      # the runner and this job uploads nothing, so it gates the 200-row build
      # without the artefact exposure that made `download-artifact` wrong above.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/contenu.spec.ts
      # Pin to a full commit SHA before first use; Dependabot's github-actions
      # ecosystem keeps it current. Tags are mutable, SHAs are not.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  smoke:
    name: production smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      # Placeholder: the domain is not registered yet (spec §14). Task 16 sets
      # this to the real domain in the same commit as astro.config.mjs's `site`
      # and wrangler.toml's custom-domain route — never separately, or the QR
      # codes, this smoke test and the deployed asset origin disagree.
      URL_PROD: https://annuaire.lacartoucherie.fr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/production.spec.ts
