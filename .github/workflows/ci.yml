name: CI

# The flow: a feature branch deploys nothing — it is tested through its pull
# request. A merge to develop deploys staging; a merge to main deploys
# production. Both pass the same gate first.
on:
  push:
    branches: [develop, main]
  pull_request:

# Fail closed: least privilege, cancel superseded runs, cap every job.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded PR run is waste; a deploy cut off mid-upload is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"

jobs:
  verify:
    name: types, unit, build, budgets
    runs-on: ubuntu-latest        # never macos: it bills at 10x
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        # fetch-depth: 0 (final-fixes-report.md, I8): verify-history.mjs
        # greps `git log --all`, which sees only the one fetched commit on
        # the default shallow checkout — the check went green without
        # examining any history at all, exactly the failure its own header
        # comment warns about. Full history is the whole point here.
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: node scripts/sync-content.mjs
      - run: npx astro check
      - run: node scripts/forbidden.mjs
      - run: node scripts/verify-history.mjs
      - run: npm test
      - run: npm run build
      - run: node scripts/forbidden-dist.mjs
      - run: node scripts/budgets.mjs
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  commits:
    name: conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx commitlint --from "origin/${{ github.base_ref }}" --to HEAD --verbose
      - name: no AI attribution
        run: |
          if git log "origin/${{ github.base_ref }}..HEAD" --format='%B' \
             | grep -niE 'co-authored-by:|generated with|claude-session'; then
            echo "::error::Commit messages credit no AI (CLAUDE.md)."
            exit 1
          fi

  browser:
    name: axe, journey, zoom, targets
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      # Chromium only. WebKit costs a minute to install and only approximates
      # Safari; real Safari is a human check on a real device.
      - name: cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 3

  lighthouse:
    name: lighthouse budgets
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with: { name: dist, path: dist }
      - run: npx lhci autorun
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: lighthouse
          path: .lighthouseci
          retention-days: 3

  # One job for both environments: develop → staging, main → production.
  # Each GitHub Environment holds its own secrets and variables under the same
  # names, so the steps never branch on which one they are deploying.
  # production carries a required reviewer; staging does not.
  deploy:
    if: github.event_name == 'push'
    needs: [verify, browser, lighthouse]   # the gate: no green, no deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      url: ${{ vars.SITE_URL }}
    env:
      # Every QR code and canonical URL encodes this at build time.
      SITE_URL: ${{ vars.SITE_URL }}
      # Not `main && '' || 'staging'`: '' is falsy, so that yields 'staging' on main.
      WRANGLER_ENV: ${{ github.ref != 'refs/heads/main' && 'staging' || '' }}
    steps:
      - name: SITE_URL is set
        run: |
          test -n "$SITE_URL" || { echo "::error::Set the SITE_URL variable on this environment."; exit 1; }
      - uses: actions/checkout@v7
      # The real quartier. Private, read-only, and never uploaded as an artifact:
      # a public repository's Actions tab hands out artifacts to anyone.
      - uses: actions/checkout@v7
        with:
          # Same owner as this repository: wherever the code lives, the data lives.
          repository: ${{ github.repository_owner }}/cartoucherie-donnees
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          path: content-private
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          CONTENT_DIR: content-private
          # Without this the beacon ships with an empty token: the script still
          # loads, the smoke test still passes, and nothing is ever counted.
          PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
      - run: node scripts/forbidden-dist.mjs
      - run: node scripts/budgets.mjs
      # Staging carries real neighbours too: keep it out of search engines, or
      # a visitor lands on a test copy instead of the real directory.
      - if: env.WRANGLER_ENV == 'staging'
        run: |
          printf '\n/*\n  X-Robots-Tag: noindex, nofollow\n' >> dist/_headers
      # The only moment a browser sees the real quartier before it goes out. It
      # runs in-process on the runner and this job uploads nothing, so it gates
      # the real build without the artefact exposure of download-artifact.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/contenu.spec.ts
      # Pinned to a full commit SHA (v4.1.3); Dependabot's github-actions
      # ecosystem keeps it current. Tags are mutable, SHAs are not.
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --env "" names the top-level (production) Worker explicitly.
          command: deploy --env "${{ env.WRANGLER_ENV }}"
      # Against the live host this job just deployed: HTTPS, headers, no cookie.
      - run: npx playwright test tests/e2e/deployed.spec.ts
        env:
          URL_DEPLOYED: ${{ vars.SITE_URL }}
