name = "www"
compatibility_date = "2026-09-01"

# Production: `wrangler deploy`, from main. Staging: `wrangler deploy --env
# staging`, from develop — a second Worker that inherits [assets] above.
#
# Each route must match its GitHub Environment's SITE_URL variable — the value
# every QR code encodes. The first deploy creates the DNS records and
# certificates. The apex is attached too, so a typed « cartoucherie.fyi » works;
# its canonical link points at www.
routes = [
  { pattern = "www.cartoucherie.fyi", custom_domain = true },
  { pattern = "cartoucherie.fyi", custom_domain = true },
]
# One address per environment: no second, ungated copy on workers.dev.
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
# Default "auto-trailing-slash" 307-redirects /annuaire -> /annuaire/ (verified
# with `wrangler dev`, 2026-09-17): Astro emits annuaire/index.html, and the
# default handling only serves a folder index at its trailing-slash URL.
# public/sw.js precaches the literal string "/annuaire" (no slash) via
# cache.addAll; a cached *redirect* response cannot satisfy a navigation
# request in Chrome, so the entry is silently useless offline. "drop-trailing-
# slash" makes /annuaire itself the canonical, directly-served URL (redirecting
# /annuaire/ -> /annuaire instead), matching the service worker's precache list
# exactly. Re-check with `curl -sI https://www.cartoucherie.fyi/annuaire` after every deploy.
html_handling = "drop-trailing-slash"
# Default "none" serves an empty body on a 404 status for any unmatched path
# (verified with `wrangler dev`, task-16-report.md fix round 1) — Cloudflare
# does not pick up dist/404.html on its own. src/pages/404.astro exists
# precisely because this project's QR codes are printed on paper and a stale
# one is a real, expected visitor path, not an edge case; "404-page" is what
# tells the asset server to actually serve it.
not_found_handling = "404-page"

[env.staging]
name = "staging"
routes = [{ pattern = "staging.cartoucherie.fyi", custom_domain = true }]
workers_dev = false
preview_urls = false
